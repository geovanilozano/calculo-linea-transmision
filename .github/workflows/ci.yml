name: CI

# Puerta de calidad: corre en cada push a main y en cada Pull Request.
on:
  push:
    branches: [main]
  pull_request:

# Si se empuja varias veces seguidas, cancela las corridas viejas del mismo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Instalar dependencias de Node
        run: npm install

      # styles.css es un artefacto de build (esta en .gitignore), pero
      # test_static_css_disponible lo exige. Se compila igual que en Render.
      - name: Compilar CSS
        run: npm run build:css

      - name: Pruebas
        run: pytest -q
